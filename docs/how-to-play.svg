<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Unicorn Stampede: how to play</title>
<desc id="d">A visual guide showing Blue WASD route planning, Yellow rainbow whip chaining, herd escalation from two to six unicorns, landmark destruction, and advanced strategy.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07142d"/><stop offset=".55" stop-color="#17152f"/><stop offset="1" stop-color="#441738"/></linearGradient>
  <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#18233f" stop-opacity=".96"/><stop offset="1" stop-color="#0b1021" stop-opacity=".96"/></linearGradient>
  <linearGradient id="rainbow" x1="0" x2="1"><stop stop-color="#ff5f83"/><stop offset=".28" stop-color="#ffe56d"/><stop offset=".55" stop-color="#73eda0"/><stop offset=".78" stop-color="#64dcff"/><stop offset="1" stop-color="#d782ff"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .h{font:700 46px system-ui,sans-serif;fill:#fff}.sub{font:600 19px system-ui,sans-serif;fill:#cbd6ef}.ph{font:800 25px system-ui,sans-serif;fill:#fff}.b{font:600 17px system-ui,sans-serif;fill:#dce7ff}.small{font:600 14px system-ui,sans-serif;fill:#afbdd8}.key{font:800 20px system-ui,sans-serif;fill:#08101f}.num{font:900 30px system-ui,sans-serif;fill:#fff}.label{font:800 13px system-ui,sans-serif;letter-spacing:1.5px;fill:#93a5c9}.center{text-anchor:middle}.round{stroke-linejoin:round;stroke-linecap:round}
  </style>
</defs>
<rect width="1200" height="720" fill="url(#bg)"/>
<circle cx="1065" cy="78" r="115" fill="#ff5f83" opacity=".05"/><circle cx="1140" cy="155" r="125" fill="#64dcff" opacity=".04"/>
<text x="60" y="70" class="h">UNICORN STAMPEDE</text>
<text x="60" y="104" class="sub">Control two. Leave four working. Turn the whole town into a rainbow emergency.</text>
<rect x="45" y="145" width="345" height="330" rx="28" fill="url(#panel)" stroke="#73dfff" stroke-width="2"/>
<text x="75" y="185" class="label">BLUE ROSTER · ROUTE PLANNING</text>
<text x="75" y="222" class="ph" style="font-size:22px">STEER → RELEASE → NEXT</text>
<g transform="translate(76 250)">
  <rect width="52" height="45" rx="9" fill="#d9f8ff"/><rect x="58" width="52" height="45" rx="9" fill="#d9f8ff"/><rect x="116" width="52" height="45" rx="9" fill="#d9f8ff"/><rect x="58" y="51" width="52" height="45" rx="9" fill="#d9f8ff"/>
  <text x="26" y="29" class="key center">A</text><text x="84" y="29" class="key center">W</text><text x="142" y="29" class="key center">D</text><text x="84" y="80" class="key center">S</text>
</g>
<g transform="translate(284 286)"><ellipse rx="34" ry="21" fill="#fff"/><circle cx="32" cy="-18" r="17" fill="#fff"/><path d="M38-32 53-66 48-27" fill="#73dfff"/><path d="M-31 0 Q-78 2 -94 28" fill="none" stroke="#73dfff" stroke-width="12" class="round"/><circle cx="37" cy="-21" r="3" fill="#11192b"/></g>
<path d="M80 375 C155 325 220 430 326 365" fill="none" stroke="#73dfff" stroke-width="8" stroke-dasharray="14 12" class="round" opacity=".85"/>
<path d="M314 354 339 363 320 380" fill="none" stroke="#73dfff" stroke-width="8" class="round"/>
<text x="75" y="416" class="b">Release the last WASD key to leave</text>
<text x="75" y="440" class="b">that unicorn running its route.</text>
<text x="75" y="462" class="small">Set it up, then spend attention elsewhere.</text>
<rect x="810" y="145" width="345" height="330" rx="28" fill="url(#panel)" stroke="#ffe56d" stroke-width="2"/>
<text x="840" y="185" class="label">YELLOW ROSTER · PRISM CHASE</text>
<text x="840" y="222" class="ph" style="font-size:21px">AIM BESIDE → CLICK ×3</text>
<g transform="translate(960 300)"><ellipse rx="34" ry="21" fill="#fff"/><circle cx="32" cy="-18" r="17" fill="#fff"/><path d="M38-32 53-66 48-27" fill="#ffe56d"/><path d="M-31 0 Q-78 2 -94 28" fill="none" stroke="#ffe56d" stroke-width="12" class="round"/><circle cx="37" cy="-21" r="3" fill="#11192b"/></g>
<circle cx="960" cy="300" r="88" fill="none" stroke="#ffe56d" stroke-width="5" stroke-dasharray="15 10" opacity=".7"/>
<g transform="translate(866 280) rotate(-18)" filter="url(#glow)">
 <path d="M0 18 A34 34 0 1 1 45 48" fill="none" stroke="#ff5f83" stroke-width="12" class="round"/>
 <path d="M7 18 A27 27 0 1 1 43 43" fill="none" stroke="#ffe56d" stroke-width="8" class="round"/>
 <path d="M14 18 A20 20 0 1 1 40 38" fill="none" stroke="#64dcff" stroke-width="4" class="round"/>
 <path d="M-7 18 H7 M0 11 V25" stroke="#fff" stroke-width="3" class="round"/>
</g>
<path d="M900 305 Q930 255 960 300" fill="none" stroke="url(#rainbow)" stroke-width="9" class="round"/>
<text x="840" y="385" class="b">The whip launches Yellow away from</text>
<text x="840" y="409" class="b">the cursor. Use the angle on purpose.</text>
<g transform="translate(842 430)"><circle cx="18" cy="0" r="18" fill="#ff5f83"/><circle cx="74" cy="0" r="18" fill="#ffe56d"/><circle cx="130" cy="0" r="18" fill="#64dcff"/><text x="18" y="7" class="key center">1</text><text x="74" y="7" class="key center">2</text><text x="130" y="7" class="key center">3X</text><path d="M38 0 H54 M94 0 H110" stroke="#fff" stroke-width="4"/></g>
<text x="1005" y="436" class="small">3X = Prism + switch</text>
<rect x="420" y="145" width="360" height="330" rx="28" fill="url(#panel)" stroke="#a785ff" stroke-width="2"/>
<text x="600" y="184" class="label center">THE REAL GAME</text>
<text x="600" y="220" class="ph center" style="font-size:18px">BUILD MOMENTUM</text><text x="600" y="244" class="small center">NOT MICROMANAGEMENT</text>
<g transform="translate(468 272)">
  <circle cx="28" cy="15" r="23" fill="#73dfff"/><circle cx="66" cy="15" r="23" fill="#ffe56d"/>
  <text x="47" y="70" class="num center">2</text><text x="47" y="92" class="small center">learn</text>
  <path d="M96 15 H124" stroke="#fff" stroke-width="4"/><path d="m118 7 11 8-11 8" fill="none" stroke="#fff" stroke-width="4"/>
  <circle cx="150" cy="0" r="17" fill="#73dfff"/><circle cx="184" cy="0" r="17" fill="#73dfff" opacity=".6"/><circle cx="150" cy="36" r="17" fill="#ffe56d"/><circle cx="184" cy="36" r="17" fill="#ffe56d" opacity=".6"/>
  <text x="167" y="87" class="num center">4</text><text x="167" y="109" class="small center">switch</text>
  <path d="M211 15 H239" stroke="#fff" stroke-width="4"/><path d="m233 7 11 8-11 8" fill="none" stroke="#fff" stroke-width="4"/>
  <g transform="translate(254 -2)"><circle cx="12" cy="0" r="12" fill="#73dfff"/><circle cx="38" cy="0" r="12" fill="#73dfff" opacity=".7"/><circle cx="64" cy="0" r="12" fill="#73dfff" opacity=".45"/><circle cx="12" cy="30" r="12" fill="#ffe56d"/><circle cx="38" cy="30" r="12" fill="#ffe56d" opacity=".7"/><circle cx="64" cy="30" r="12" fill="#ffe56d" opacity=".45"/></g>
  <text x="292" y="87" class="num center">6</text><text x="292" y="109" class="small center">orchestrate</text>
</g>
<text x="600" y="398" class="b center">Keep several unicorns ACTIVE at once.</text>
<text x="600" y="423" class="b center">More activity = more paint + more pressure.</text>
<rect x="485" y="441" width="230" height="25" rx="12" fill="#252d45"/><rect x="485" y="441" width="185" height="25" rx="12" fill="url(#rainbow)"/><text x="600" y="460" class="small center" fill="#fff">ACTIVE 5/6</text>
<rect x="45" y="505" width="1110" height="165" rx="28" fill="#090f20" stroke="#ffffff" stroke-opacity=".18"/>
<text x="70" y="540" class="label">WIN THE TOWN</text>
<g transform="translate(72 562)">
 <g><rect width="120" height="62" rx="14" fill="#24162a" stroke="#ff829f"/><text x="60" y="28" class="b center">BAKERY</text><text x="60" y="49" class="small center">smash</text></g>
 <path d="M130 31 H154" stroke="#8ea0bf" stroke-width="3"/>
 <g transform="translate(164)"><rect width="120" height="62" rx="14" fill="#2b2215" stroke="#ffd46d"/><text x="60" y="28" class="b center">MARKET</text><text x="60" y="49" class="small center">powerups</text></g>
 <path d="M294 31 H318" stroke="#8ea0bf" stroke-width="3"/>
 <g transform="translate(328)"><rect width="135" height="62" rx="14" fill="#13251c" stroke="#74e5a1"/><text x="67" y="28" class="b center">GREENHOUSE</text><text x="67" y="49" class="small center">territory</text></g>
 <path d="M473 31 H497" stroke="#8ea0bf" stroke-width="3"/>
 <g transform="translate(507)"><rect width="120" height="62" rx="14" fill="#142334" stroke="#78cfff"/><text x="60" y="28" class="b center">CLOCK</text><text x="60" y="49" class="small center">anger</text></g>
 <path d="M637 31 H661" stroke="#8ea0bf" stroke-width="3"/>
 <g transform="translate(671)"><rect width="170" height="62" rx="14" fill="#302514" stroke="#ffe56d" stroke-width="2"/><text x="85" y="27" class="ph center" style="font-size:22px">TOWN HALL</text><text x="85" y="49" class="small center">after all four</text></g>
 </g>
<line x1="930" y1="548" x2="930" y2="648" stroke="#ffffff" stroke-opacity=".12"/>
<text x="1038" y="540" class="label center">EXPERT PLAY</text>
<text x="954" y="574" class="small">• Route through future targets</text><text x="954" y="597" class="small">• Whip for useful launch angles</text><text x="954" y="620" class="small">• Stun cleanup while boosted</text><text x="954" y="643" class="small">• Space = two interventions</text>
<text x="600" y="700" class="small center">The best run feels like controlled chaos: set a plan, let it run, intervene somewhere else, then surf the consequences.</text>
</svg>
