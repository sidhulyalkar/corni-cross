name: qualify-13kb
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: qualify-13kb-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Compression report
        run: cat dist/compression.json
      - name: Verify archive root
        run: unzip -t dist/unicorn-stampede.zip && test "$(unzip -Z1 dist/unicorn-stampede.zip)" = "index.html"
      - name: Verify browser-safe local build
        run: test -s dist/local.html && ! grep -q "document.write" dist/local.html && cmp dist/local.html dist/preview.html
      - name: Publish qualified dist to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet HEAD^ HEAD -- src scripts package.json package-lock.json index.html; then
            echo "No release inputs changed; keeping the checked-in qualified dist snapshot"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "dist already matches the qualified build"
          else
            git commit -m "chore: refresh qualified dist [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: unicorn-stampede-dist
          path: |
            dist/local.html
            dist/unicorn-stampede.zip
            dist/index.html
            dist/preview.html
            dist/compression.json
